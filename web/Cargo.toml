[package]
name = "shop-proof-web"
version = "0.1.0"
edition = "2021"
authors = ["Shop-Proof Team"]
description = "Shop-Proof Web Layer - Axum + HTMX + Pico.css"
license = "MIT"
readme = "../README.md"

[dependencies]
# Core domain
shop-proof-core = { path = "../core" }

# Web framework
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Async
tokio = { version = "1.0", features = ["full"] }

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
default = []
